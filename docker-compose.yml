services:
  phonebook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: org_phonebook
    restart: unless-stopped
    ports:
      - "4400:4400"
    environment:
      - NODE_ENV=production
      - PORT=4400
      - STORAGE_PATH=/app/storage
      - TZ=Asia/Tehran
    volumes:
      # Persistent storage mapped outside container for full data safety across rebuilds
      - ${STORAGE_PATH:-../org-phonebook-data}:/app/storage
      # Enforce host system time synchronization for audit logs and Persian calendar
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4400/healthz', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
