services:
  phonebook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: org_phonebook
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Persistent storage for JSON database, employee avatars, company assets, and automated backups
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
