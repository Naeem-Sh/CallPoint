services:
  phonebook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: org_phonebook
    restart: unless-stopped
    ports:
      - "4400:4400"
    environment:
      - NODE_ENV=production
      - PORT=4400
      - STORAGE_PATH=/app/storage
    volumes:
      # ذخیره دائم داده‌ها در مسیری کاملاً خارج از پوشه پروژه تا با حذف یا آپدیت کدها هیچ داده‌ای از دست نرود
      # Stores data in a directory outside the project folder (e.g. ../org-phonebook-data)
      # You can also customize this path by setting STORAGE_PATH in your .env file
      - ${STORAGE_PATH:-../org-phonebook-data}:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4400/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
