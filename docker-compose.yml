services:
  phonebook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: org_phonebook
    restart: unless-stopped
    ports:
      - "4400:4400"
    environment:
      - NODE_ENV=production
      - PORT=4400
      - DATA_DIR=/app/data
      - TZ=Asia/Tehran
      - RESET_ADMIN_PASSWORD=false
      - JWT_SECRET=fallback-production-jwt-secret-replace-me
      - INITIAL_ADMIN_USERNAME=admin
      - INITIAL_ADMIN_PASSWORD=123
    volumes:
      # Standardized persistent storage directory mapped outside container
      - ./data:/app/data
      # Enforce host system time synchronization for audit logs and Persian calendar
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4400/healthz', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
